# タグセット定義
#
# 第1層は固定7種。第2層は必ず1つの第1層に所属する。
# 書き方と運用は docs/tag-rule.md、形式の選定理由は
# docs/architectural-decision.md の ADR-0003 を参照。
#
# 初期化: 2026-08-29 に既存記事から第2層タグを抽出して作成。
# 各タグのコメントは現時点の記事数。
# parent = "n/a" は第1層への所属が未確定のタグ。

