name: Zola Check (Scheduled)

on:
  schedule:
    # 毎月15日 0:00 UTC (= 9:00 JST)
    - cron: '0 0 15 * *'
  # 手動実行も可能
  workflow_dispatch:

jobs:
  zola-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Zola
        run: |
          wget -q https://github.com/getzola/zola/releases/download/v0.20.0/zola-v0.20.0-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf zola-v0.20.0-x86_64-unknown-linux-gnu.tar.gz
          sudo mv zola /usr/local/bin/

      - name: Run zola check
        run: zola check
