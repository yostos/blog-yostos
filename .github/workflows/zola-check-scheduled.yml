name: Zola Check (Scheduled)

on:
  schedule:
    # 毎月15日 0:00 UTC (= 9:00 JST)
    - cron: '0 0 15 * *'
  # 手動実行も可能
  workflow_dispatch:

jobs:
  zola-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1

      - name: Run zola check
        run: zola check
