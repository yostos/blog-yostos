name: Post to Bluesky

on:
  push:
    branches: [main]
    paths: ['content/**']

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect new articles
        id: detect
        run: |
          new_articles=$(git diff --name-status HEAD~1 HEAD | grep '^A' | awk '{print $2}' | grep 'content/.*/index\.md$' || true)
          if [ -z "$new_articles" ]; then
            echo "No new articles found"
            echo "has_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "New articles found:"
            echo "$new_articles"
            # Store as multiline output
            {
              echo "articles<<EOF"
              echo "$new_articles"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "has_new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Post to Bluesky
        if: steps.detect.outputs.has_new == 'true'
        env:
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          NEW_ARTICLES: ${{ steps.detect.outputs.articles }}
        run: |
          echo "$NEW_ARTICLES" | while IFS= read -r article; do
            [ -z "$article" ] && continue
            bash scripts/bluesky-post.sh "$article"
          done
