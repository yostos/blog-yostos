name: OGP Check

# Required status check for main. Do not add a `paths:` filter:
# a required check whose workflow never starts stays pending and blocks the merge.
#
# Every article must have an OGP image, so this checks all articles,
# not only the ones changed in the PR.
#
# It also runs on push to main. The Ruleset does not require branches to be
# up to date before merging, so the merged state can differ from what the
# PR checked.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ogp-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # 3.15 or later: tomllib supports TOML 1.1, which Zola accepts
      # (e.g. `date = 2026-04-27T16:30+09:00` without seconds).
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'

      - name: Check ogp.webp and social_media_card for all articles
        shell: python
        run: |
          import pathlib, re, sys, tomllib

          failed = False
          articles = sorted(pathlib.Path("content/blog").rglob("index.md"))
          for path in articles:
              if not (path.parent / "ogp.webp").is_file():
                  print(f"::error file={path}::Missing {path.parent}/ogp.webp. Run 'npm run ogp' to generate it.")
                  failed = True
              m = re.match(r"\+\+\+\n(.*?)\n\+\+\+", path.read_text(encoding="utf-8"), re.S)
              try:
                  card = tomllib.loads(m.group(1)).get("extra", {}).get("social_media_card") if m else None
              except tomllib.TOMLDecodeError as e:
                  print(f"::error file={path}::Invalid TOML frontmatter: {e}")
                  failed = True
                  continue
              if card != "ogp.webp":
                  print(f"::error file={path}::[extra] social_media_card must be \"ogp.webp\" (found: {card!r}).")
                  failed = True
          print(f"Checked {len(articles)} articles.")
          sys.exit(1 if failed else 0)
