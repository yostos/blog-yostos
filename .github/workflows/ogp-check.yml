name: OGP Check

# Required status check for main. Do not add a `paths:` filter:
# a required check whose workflow never starts stays pending and blocks the merge.
#
# Every article must have an OGP image, so this checks all articles,
# not only the ones changed in the PR.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ogp-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check ogp.webp and social_media_card for all articles
        run: |
          missing=0
          count=0
          while IFS= read -r file; do
            count=$((count + 1))
            dir=$(dirname "$file")
            if [ ! -f "$dir/ogp.webp" ]; then
              echo "::error file=$file::Missing $dir/ogp.webp. Run 'npm run ogp' to generate it."
              missing=1
            fi
            if ! grep -qE '^social_media_card[[:space:]]*=[[:space:]]*"ogp\.webp"' "$file"; then
              echo "::error file=$file::Missing social_media_card = \"ogp.webp\" in [extra]."
              missing=1
            fi
          done < <(find content/blog -name index.md | sort)
          echo "Checked $count articles."
          exit $missing
