name: Textlint

on:
  # PRs only. main accepts changes only through PRs that passed this
  # check, so running it again after the merge adds nothing.
  pull_request:
    branches: [main]

jobs:
  textlint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run textlint
        run: npm run lint
