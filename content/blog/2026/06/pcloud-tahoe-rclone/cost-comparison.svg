<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="-apple-system, 'Helvetica Neue', 'Hiragino Sans', sans-serif" role="img" aria-label="2TBストレージの累計コスト比較。pCloudは2021年に約38200円の買い切り、Dropboxは年額15840円で累計が増え、約2.4年でpCloudが有利になる。">
  <rect x="0" y="0" width="760" height="440" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">2TBストレージの累計コスト（円）</text>

  <!-- X gridlines and labels (累計金額) -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="90" y1="70" x2="90" y2="380"/>
    <line x1="200" y1="70" x2="200" y2="380"/>
    <line x1="310" y1="70" x2="310" y2="380"/>
    <line x1="420" y1="70" x2="420" y2="380"/>
    <line x1="530" y1="70" x2="530" y2="380"/>
    <line x1="640" y1="70" x2="640" y2="380"/>
  </g>
  <g font-size="12" fill="#6b7280" text-anchor="middle">
    <text x="90" y="400">0</text>
    <text x="200" y="400">2万</text>
    <text x="310" y="400">4万</text>
    <text x="420" y="400">6万</text>
    <text x="530" y="400">8万</text>
    <text x="640" y="400">10万</text>
  </g>
  <text x="365" y="424" text-anchor="middle" font-size="13" fill="#374151">累計金額（円）</text>

  <!-- Y axis (年, past at top) -->
  <line x1="90" y1="70" x2="90" y2="380" stroke="#9ca3af" stroke-width="1.5"/>
  <g font-size="12" fill="#374151" text-anchor="end">
    <text x="78" y="74">2021</text>
    <text x="78" y="136">2022</text>
    <text x="78" y="198">2023</text>
    <text x="78" y="260">2024</text>
    <text x="78" y="322">2025</text>
    <text x="78" y="384">2026</text>
  </g>
  <text x="34" y="225" text-anchor="middle" font-size="13" fill="#374151" transform="rotate(-90 34 225)">年</text>

  <!-- pCloud: one-time 38,200 yen (vertical line at x=300) -->
  <line x1="300" y1="70" x2="300" y2="380" stroke="#2563eb" stroke-width="2.5"/>
  <g fill="#2563eb">
    <circle cx="300" cy="70" r="3.5"/>
    <circle cx="300" cy="380" r="3.5"/>
  </g>

  <!-- Dropbox: cumulative 15,840 yen/year from 2021 start (past at top) -->
  <polyline points="90,70 177,132 264,194 351,256 439,318 526,380" fill="none" stroke="#ea580c" stroke-width="2.5"/>
  <g fill="#ea580c">
    <circle cx="90" cy="70" r="3.5"/>
    <circle cx="177" cy="132" r="3.5"/>
    <circle cx="264" cy="194" r="3.5"/>
    <circle cx="351" cy="256" r="3.5"/>
    <circle cx="439" cy="318" r="3.5"/>
    <circle cx="526" cy="380" r="3.5"/>
  </g>

  <!-- crossover marker (~2.4 years, during 2023-2024) -->
  <circle cx="300" cy="220" r="4.5" fill="none" stroke="#111827" stroke-width="1.5"/>
  <text x="312" y="224" font-size="11.5" fill="#111827">約2.4年でpCloudが有利に</text>

  <!-- legend -->
  <g font-size="12.5">
    <rect x="500" y="110" width="14" height="3" fill="#2563eb"/>
    <text x="520" y="114" fill="#374151">pCloud（買い切り 約38,200円）</text>
    <rect x="500" y="132" width="14" height="3" fill="#ea580c"/>
    <text x="520" y="136" fill="#374151">Dropbox（年額15,840円）</text>
  </g>
</svg>
